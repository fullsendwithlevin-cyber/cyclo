# Lokaler/Self-Hosted-Betrieb: Postgres mit pgvector, Web-App und Worker.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
      POSTGRES_DB: assistant
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:-assistant}@db:5432/assistant
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:-assistant}@db:5432/assistant
      UPLOAD_DIR: /app/storage/uploads
    ports: ["3000:3000"]
    volumes: [uploads:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD:-assistant}@db:5432/assistant
      UPLOAD_DIR: /app/storage/uploads
    command: ["npx", "tsx", "workers/index.ts"]
    volumes: [uploads:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # Optional: Llama lokal über Ollama (kostenlos, ohne Konto). Start mit
  #   docker compose --profile llama up -d --build
  #   docker compose exec ollama ollama pull llama3.1:8b
  #   docker compose exec ollama ollama pull nomic-embed-text
  # und in .env: AI_PROVIDER=llama, LLAMA_BASE_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama
    profiles: [llama]
    volumes: [ollama:/root/.ollama]

  # Optional: automatisches HTTPS (Let's Encrypt). Start mit
  #   DOMAIN=mein-name.duckdns.org docker compose --profile https up -d --build
  caddy:
    image: caddy:2
    profiles: [https]
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "web:3000"]
    ports: ["80:80", "443:443"]
    volumes: [caddy:/data]
    depends_on: [web]

volumes:
  pgdata:
  uploads:
  caddy:
  ollama:
